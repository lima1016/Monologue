<!doctype html>
<html lang="ko" data-theme="default" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 · 테마 고르기</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/mock/mock.js"></script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/mock/mock.css">
<style>
  /* 왼쪽: 분류 탭 + 테마 카드 4열. 오른쪽 380px: 고른 테마, 직접 입력, 시작. */
  .pk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--space-6); align-items: start; }
  .pk-left { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
  .pk-left .theme-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pk-left .theme-card { min-height: 5.6rem; }
  .pk-count { margin: 0; font-size: var(--text-sm); color: var(--text-dim); }

  .pk-side { position: sticky; top: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .pk-side .panel { display: flex; flex-direction: column; gap: var(--space-3); }
  .pk-side .label { margin: 0; }
  .pk-title { margin: 0; font-size: var(--text-xl); font-weight: 750; color: var(--text); line-height: 1.3; }
  .pk-desc { margin: 0; font-size: var(--text-sm); color: var(--text-dim); }
  .pk-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .pk-chip { font-size: var(--text-xs); font-weight: 600; padding: 2px var(--space-2); border-radius: var(--radius-pill);
    background: var(--surface-sunken); color: var(--text-dim); }
  .pk-scripts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .pk-scripts button { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2);
    text-align: left; border: 0; background: transparent; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); }
  .pk-scripts button:hover:not(.on) { background: var(--accent-soft); }
  .pk-scripts button.on { background: var(--surface-sunken); font-weight: 650; }
  .pk-scripts .m { font-size: var(--text-xs); color: var(--text-dim); font-weight: 500; white-space: nowrap; }
  .pk-own { display: flex; flex-direction: column; gap: var(--space-2); }
  .pk-own input { margin-top: 0; font-size: var(--text-base); padding: var(--space-3); border-radius: var(--radius); }
  .pk-own input::placeholder { color: var(--text-faint); }
  .pk-own .hint { font-size: var(--text-sm); margin: 0; }
  .pk-side #btn-start { width: 100%; }
  .pk-side .start-status { justify-content: center; }

  @media (max-width: 1100px) { .pk-left .theme-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 900px) {
    .pk-grid { grid-template-columns: 1fr; }
    .pk-side { position: static; }
    .pk-left .theme-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
</head>
<body>
<div class="mock-tools" role="group" aria-label="시안 도구">
  <span class="mock-tag">시안 도구</span>
  <a href="/mock/index.html">← 시안 목록</a>
  <span class="mock-group"><span>테마</span>
    <button type="button" data-mock-theme="default">기본</button><button type="button" data-mock-theme="forest">숲</button><button type="button" data-mock-theme="sea">바다</button><button type="button" data-mock-theme="lavender">보라</button><button type="button" data-mock-theme="ink">먹</button><button type="button" data-mock-theme="white">하양</button>
  </span>
  <span class="mock-group"><span>밝기</span>
    <button type="button" data-mock-mode="auto">자동</button><button type="button" data-mock-mode="light">밝게</button><button type="button" data-mock-mode="dark">어둡게</button>
  </span>
  <span class="mock-note">테마 고르기 · 스크립트 모드, '여행 › 호텔 체크인'을 고른 상태</span>
</div>

<header>
  <h1>
    <a href="/mock/index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="5" y="10" width="8" height="44" rx="4"/><rect x="17" y="16" width="8" height="32" rx="4"/><rect x="28" y="22" width="8" height="20" rx="4"/><rect x="39" y="16" width="8" height="32" rx="4"/><rect x="51" y="10" width="8" height="44" rx="4"/></svg>
      Monologue
    </a>
  </h1>
  <div class="status">
    <button class="ghost" type="button">마이페이지</button>
    <button class="ghost" type="button">설정</button>
  </div>
</header>

<main class="mock-main">
  <div class="mock-head">
    <button class="ghost" type="button">← 홈</button>
    <h2>스크립트</h2>
    <span class="spacer"></span>
    <span class="seg">
      <button type="button" class="on">English</button>
      <button type="button">日本語</button>
    </span>
  </div>

  <div class="pk-grid">
    <section class="pk-left" aria-label="테마">
      <div class="tabs" role="tablist">
        <button type="button">일상</button>
        <button type="button" class="on">여행</button>
        <button type="button">스몰토크</button>
        <button type="button">비즈니스</button>
        <button type="button">학교</button>
        <button type="button">쇼핑</button>
        <button type="button">건강</button>
        <button type="button">취미</button>
      </div>
      <p class="pk-count">여행 테마 12개 · 대본은 테마마다 3개</p>
      <div class="theme-grid">
        <button type="button" class="theme-card"><span class="t">공항 체크인</span><span class="s">수하물 초과 · 창가 자리 · 탑승구 확인</span></button>
        <button type="button" class="theme-card on"><span class="t">호텔 체크인</span><span class="s">예약 확인 · 방 바꾸기 · 늦은 체크아웃</span></button>
        <button type="button" class="theme-card"><span class="t">길 묻기</span><span class="s">지하철역 찾기 · 걸어서 몇 분</span></button>
        <button type="button" class="theme-card"><span class="t">식당 주문</span><span class="s">추천 메뉴 · 알레르기 · 계산 나누기</span></button>
        <button type="button" class="theme-card"><span class="t">기차표 사기</span><span class="s">왕복표 · 좌석 지정 · 환불</span></button>
        <button type="button" class="theme-card"><span class="t">렌터카 빌리기</span><span class="s">보험 · 연료 규정 · 반납 장소</span></button>
        <button type="button" class="theme-card"><span class="t">관광 안내소</span><span class="s">지도 받기 · 투어 예약</span></button>
        <button type="button" class="theme-card"><span class="t">분실물 신고</span><span class="s">잃어버린 가방 · 연락처 남기기</span></button>
        <button type="button" class="theme-card"><span class="t">환전하기</span><span class="s">환율 묻기 · 수수료 · 잔돈</span></button>
        <button type="button" class="theme-card"><span class="t">약국에서</span><span class="s">증상 설명 · 복용법 묻기</span></button>
        <button type="button" class="theme-card"><span class="t">택시 타기</span><span class="s">목적지 말하기 · 카드 되나요</span></button>
        <button type="button" class="theme-card"><span class="t">숙소 문제</span><span class="s">에어컨 고장 · 소음 · 방 청소</span></button>
      </div>
    </section>

    <aside class="pk-side" aria-label="고른 테마">
      <div class="panel">
        <p class="label">고른 테마</p>
        <p class="pk-title">호텔 체크인</p>
        <p class="pk-desc">프런트에서 예약을 확인하고, 방 문제를 부탁하는 대화예요.</p>
        <div class="pk-chips"><span class="pk-chip">예약 확인</span><span class="pk-chip">방 바꾸기</span><span class="pk-chip">늦은 체크아웃</span><span class="pk-chip">조식 시간</span></div>
        <p class="label">대본 고르기</p>
        <ul class="pk-scripts">
          <li><button type="button" class="on"><span>예약한 방이 트윈이 아니에요</span><span class="m">12줄 · 약 4분</span></button></li>
          <li><button type="button"><span>늦게 도착해서 체크인하기</span><span class="m">10줄 · 약 3분</span></button></li>
          <li><button type="button"><span>체크아웃을 늦출 수 있을까요</span><span class="m">9줄 · 약 3분</span></button></li>
        </ul>
      </div>
      <div class="pk-own">
        <input type="text" aria-label="직접 입력" placeholder="직접 입력: 예) 호텔에 우산을 두고 왔어요">
        <p class="hint">쓰면 고른 테마 대신 그 상황으로 새 대본을 만들어요</p>
      </div>
      <button id="btn-start" class="primary" type="button">시작</button>
      <div class="start-status is-invisible" aria-hidden="true">
        <div class="thinking"><i></i><i></i><i></i></div>
        <span>대본 만드는 중...</span>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
