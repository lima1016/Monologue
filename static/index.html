<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monologue</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<header>
  <h1>Monologue</h1>
  <div class="status">
    <span id="status-ollama" class="dot" title="Ollama"></span>
    <span id="status-voicevox" class="dot" title="VOICEVOX"></span>
    <button id="btn-settings" class="ghost">설정</button>
  </div>
</header>

<main>
  <p id="notice" class="notice" hidden></p>

  <section id="home">
    <div class="home-head">
      <h2 id="home-greeting">오늘은 뭘 연습할까요?</h2>
      <span class="seg" id="language-seg">
        <button type="button" data-language="en" class="on">English</button>
        <button type="button" data-language="ja">日本語</button>
      </span>
    </div>

    <div id="resume-card" hidden>
      <div>
        <p id="resume-title"></p>
        <p id="resume-sub" class="hint"></p>
      </div>
      <button id="btn-resume">계속 →</button>
    </div>

    <p id="recommend" class="recommend" hidden></p>

    <input id="wish" type="text" placeholder="예: 구직 면접, 병원 접수, 길 묻기">
    <p class="hint">비워두고 시작하면 봇이 골라줍니다</p>

    <div id="chips" class="chips"></div>

    <div class="modes" id="modes">
      <button type="button" data-mode="free" class="mode on">
        <span class="n">자유 상황극</span><span class="d">상황을 정하고 자유롭게 대화</span>
      </button>
      <button type="button" data-mode="script" class="mode">
        <span class="n">스크립트</span><span class="d">대본을 따라 읽으며 연습</span>
      </button>
      <button type="button" data-mode="lesson" class="mode">
        <span class="n">수업</span><span class="d">선생님과 주제를 잡고</span>
      </button>
    </div>

    <button id="btn-start" class="primary">시작</button>

    <div class="stats" id="home-stats" hidden>
      <div class="stat"><span class="v" id="stat-streak">0</span><span class="k">연속 학습일</span></div>
      <div class="stat"><span class="v" id="stat-week">0</span><span class="k">이번 주 발화</span></div>
      <div class="stat"><span class="v" id="stat-fixed">0</span><span class="k">고친 표현</span></div>
    </div>
  </section>

  <section id="session" hidden>
    <div class="session-grid">
      <div class="conversation-col">
        <div id="conversation"></div>
        <div id="thinking" class="thinking" hidden><i></i><i></i><i></i></div>
      </div>

      <aside class="side-panel" id="side-panel">
        <p class="label" id="panel-title">목표</p>
        <div id="panel-body"></div>
      </aside>
    </div>

    <div id="mic-dock">
      <button id="btn-mic" class="mic" aria-label="말하기"></button>
      <p id="mic-hint" class="hint">누르고 말하면 자동으로 전송됩니다</p>
      <div id="controls">
        <input id="text-input" type="text" placeholder="직접 입력해도 됩니다">
        <button id="btn-send">보내기</button>
        <button id="btn-next" hidden>다음 →</button>
        <button id="btn-end" class="ghost">세션 끝내기</button>
      </div>
    </div>
  </section>

  <section id="report" hidden>
    <h2>수업 리포트</h2>
    <div id="report-head">
      <p id="report-counts" class="hint"></p>
    </div>
    <div id="report-body"></div>
    <button id="btn-restart" class="primary">새 세션</button>
  </section>
</main>

<dialog id="settings">
  <h2>설정</h2>
  <label>언어
    <select id="settings-language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </label>
  <div id="voice-list"></div>
  <button id="btn-close-settings">닫기</button>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
