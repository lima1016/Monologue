<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monologue</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<header>
  <!-- A plain link, not a router call: it reloads to home the same way
       #btn-restart does, so a session left mid-way stays on the server and
       comes back as the resume card. The mark is the favicon's shape, painted
       with currentColor so the colour tokens carry it into dark mode. -->
  <h1>
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" width="22" height="22" fill="currentColor" aria-hidden="true">
        <rect x="5" y="10" width="8" height="44" rx="4"/>
        <rect x="17" y="16" width="8" height="32" rx="4"/>
        <rect x="28" y="22" width="8" height="20" rx="4"/>
        <rect x="39" y="16" width="8" height="32" rx="4"/>
        <rect x="51" y="10" width="8" height="44" rx="4"/>
      </svg>
      Monologue
    </a>
  </h1>
  <div class="status">
    <span id="status-ollama" class="dot" title="Ollama"></span>
    <span id="status-voicevox" class="dot" title="VOICEVOX"></span>
    <button id="btn-settings" class="ghost">설정</button>
  </div>
</header>

<main>
  <div id="notice" class="notice toast" role="status" aria-live="polite" hidden>
    <span id="notice-text"></span>
    <button id="notice-close" class="ghost" type="button" aria-label="알림 닫기"></button>
  </div>

  <section id="home">
    <div class="home-main">
      <p class="home-date" id="home-date"></p>
      <div class="home-head">
        <h2 id="home-greeting">오늘은 뭘 연습할까요?</h2>
        <span class="seg" id="language-seg">
          <button type="button" data-language="en" class="on">English</button>
          <button type="button" data-language="ja">日本語</button>
        </span>
      </div>

      <!-- Filled by home.js renderToday: the theme, why, and one start button per mode. -->
      <div id="today-card" class="today-card">
        <p class="label">오늘의 추천</p>
        <div id="today-body" class="fade"></div>
      </div>
      <p id="today-alt" class="today-alt is-invisible" aria-hidden="true"></p>

      <p id="recommend" class="recommend" hidden></p>

      <!-- Each card goes to #pick for that mode; none of them is "selected" here. -->
      <div class="modes" id="modes">
        <button type="button" data-mode="free" class="mode">
          <span class="n">자유 상황극</span><span class="d">상황을 정하고 자유롭게 대화</span>
        </button>
        <button type="button" data-mode="script" class="mode">
          <span class="n">스크립트</span><span class="d">대본을 따라 읽으며 연습</span>
        </button>
        <button type="button" data-mode="lesson" class="mode">
          <span class="n">수업</span><span class="d">선생님과 주제를 잡고</span>
        </button>
      </div>

      <div id="recent-themes-wrap" hidden>
        <p class="label">최근 테마</p>
        <div id="recent-themes" class="recent-themes"></div>
      </div>
      <p id="library-progress" class="hint is-invisible" aria-hidden="true"></p>
    </div>

    <aside class="home-aside">
      <div id="resume-card" hidden>
        <div>
          <p id="resume-title"></p>
          <p id="resume-sub" class="hint"></p>
          <p id="resume-status" class="hint" hidden>대화 불러오는 중...</p>
        </div>
        <button id="btn-resume">계속 →</button>
      </div>

      <div class="panel" id="week-card" hidden>
        <p class="label">이번 주</p>
        <div id="week-days" class="week-days"></div>
        <p id="week-streak" class="hint" hidden></p>
        <p id="week-progress"></p>
        <div class="week-bar"><div id="week-bar"></div></div>
        <div class="goal">
          <button id="goal-minus" type="button" class="ghost" aria-label="목표 줄이기">−</button>
          <span>목표 <b id="goal-value"></b> 세션</span>
          <button id="goal-plus" type="button" class="ghost" aria-label="목표 늘리기">+</button>
        </div>
      </div>
    </aside>
  </section>

  <section id="pick" hidden>
    <div class="pick-head">
      <button id="btn-home" class="ghost" type="button">← 홈</button>
      <h2 id="pick-mode"></h2>
      <span class="seg" id="pick-language-seg">
        <button type="button" data-language="en">English</button>
        <button type="button" data-language="ja">日本語</button>
      </span>
    </div>
    <div id="pick-themes">
      <div id="category-tabs" class="tabs" role="tablist"></div>
      <div id="theme-grid" class="theme-grid"></div>
    </div>
    <div class="home-ask">
      <input id="wish" type="text" aria-label="직접 만들기">
      <p id="wish-hint" class="hint"></p>
    </div>
    <button id="btn-start" class="primary btn-stable">시작</button>
    <div id="start-status" class="start-status is-invisible" aria-hidden="true">
      <div class="thinking"><i></i><i></i><i></i></div>
      <span id="start-status-text"></span>
    </div>
  </section>

  <section id="session" hidden>
    <div class="session-grid">
      <div class="conversation-col">
        <div id="conversation"></div>
        <div id="thinking" class="thinking" hidden><i></i><i></i><i></i></div>
      </div>

      <aside class="side-panel" id="side-panel">
        <p class="label" id="panel-title">목표</p>
        <div id="panel-body"></div>
      </aside>
    </div>

    <div id="mic-dock">
      <button id="btn-mic" class="mic" aria-label="말하기"></button>
      <p id="mic-hint" class="hint">누르고 말한 뒤, 다 말하면 다시 눌러서 전송하세요</p>
      <button id="btn-cancel" class="ghost" type="button" hidden>취소 (Esc)</button>
      <div id="controls">
        <input id="text-input" type="text" placeholder="직접 입력해도 됩니다">
        <button id="btn-send">보내기</button>
        <button id="btn-next" hidden>다음 →</button>
        <button id="btn-suggest" class="ghost" type="button" hidden>💡 뭐라고 하지?</button>
        <button id="btn-end" class="ghost">세션 끝내기</button>
      </div>
    </div>

    <!-- The report is written by the local model and takes 10-20s. Without
         this the session screen just sits there, and pressing again looks
         like the button is broken. -->
    <div id="report-wait" class="report-wait" role="status" aria-live="polite" hidden>
      <div class="report-wait-card">
        <div class="thinking"><i></i><i></i><i></i></div>
        <p class="report-wait-title">리포트를 만들고 있어요</p>
        <p class="hint">보통 10~20초 걸려요</p>
      </div>
    </div>
  </section>

  <section id="report" hidden>
    <div class="report-main">
      <h2 id="report-headline"></h2>
      <p id="report-counts" class="hint"></p>
      <div id="report-body"></div>
      <button id="btn-restart" class="primary">새 세션</button>
    </div>
    <aside class="report-aside">
      <div class="panel" id="report-numbers">
        <p class="label">이번 세션</p>
        <div class="stat-row">
          <div class="stat"><span class="v" id="rep-turns">0</span><span class="k">턴</span></div>
          <div class="stat"><span class="v" id="rep-wrong">0</span><span class="k">고침</span></div>
          <div class="stat"><span class="v" id="rep-minutes">0</span><span class="k">분</span></div>
        </div>
      </div>
      <div class="panel" id="report-weak" hidden>
        <p class="label">자주 놓치는 것</p>
        <ul id="weak-list"></ul>
      </div>
    </aside>
  </section>
</main>

<dialog id="settings">
  <h2>설정</h2>
  <label>언어
    <select id="settings-language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </label>
  <div id="voice-list"></div>
  <fieldset id="reading-prefs">
    <legend>일본어 읽기 보조</legend>
    <label><input type="checkbox" id="pref-furigana" checked> 후리가나 (한자 위 히라가나)</label>
    <label><input type="checkbox" id="pref-romaji" checked> 발음</label>
    <div class="pron-script" role="radiogroup" aria-label="발음 표기">
      <label><input type="radio" name="pron-script" id="pref-pron-hangul" value="hangul" checked> 한글 (아리가토오)</label>
      <label><input type="radio" name="pron-script" id="pref-pron-romaji" value="romaji"> 로마자 (arigatou)</label>
    </div>
    <p class="hint">일본어 세션에만 적용됩니다. 가나를 읽을 수 있게 되면 발음부터 끄세요.</p>
  </fieldset>
  <button id="btn-close-settings">닫기</button>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
